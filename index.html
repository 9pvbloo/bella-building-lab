<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Bella Durmiente · Building Scroll Experience
  </title>
</head>

<body>

  <!-- Three.js -->
  <div id="app"></div>

  <!-- ==================================================
       CAPAS EDITORIALES
       ================================================== -->

  <div class="bella-story-ui">

    <!-- SECCIÓN 01 -->
    <section
      class="bella-story bella-story-one"
      id="storyOne"
    >
      <div class="bella-story-card">

        <div class="bella-story-image">
          <img
            src="/story/habitacion-01.jpg"
            alt="Habitación matrimonial Bella Durmiente"
          >
        </div>

        <div class="bella-story-content">

          <span class="bella-story-number">
            01
          </span>

          <p class="bella-story-eyebrow">
            Descanso
          </p>

          <h2>
            Espacios pensados
            para descansar mejor
          </h2>

          <p>
            Habitaciones cómodas y tranquilas para disfrutar
            una estadía agradable en Huancayo.
          </p>

        </div>

      </div>
    </section>


    <!-- SECCIÓN 02 -->
    <section
      class="bella-story bella-story-two"
      id="storyTwo"
    >
      <div class="bella-story-card">

        <div class="bella-story-image">
          <img
            src="/story/habitacion-02.jpg"
            alt="Habitación Bella Durmiente con vista"
          >
        </div>

        <div class="bella-story-content">

          <span class="bella-story-number">
            02
          </span>

          <p class="bella-story-eyebrow">
            Bella Durmiente
          </p>

          <h2>
            Una estadía diferente
            en Huancayo
          </h2>

          <p>
            Comodidad, atención cercana y una experiencia
            diseñada alrededor del huésped.
          </p>

        </div>

      </div>
    </section>

  </div>


  <div class="scroll-indicator">
    <span>SCROLL</span>
    <div></div>
  </div>


  <script
    type="module"
    src="/src/main.ts"
  ></script>

</body>

</html>
